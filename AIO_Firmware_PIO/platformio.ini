; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
 
[platformio]
default_envs = HoloCubic_AIO_Releases

; ESP32-specific defaults extracted into a base section so that the
; native_unit test env (host platform, no board / framework) can avoid
; inheriting board / board_build.* settings that would otherwise trip
; "BoardConfig: Board is not defined". Firmware envs extend this block.
[esp32_base]
; 2026-06 note: official PlatformIO espressif32 6.13.x carries ESP-IDF 5.5
; but still pins Arduino-ESP32 2.0.17. Use pioarduino for Arduino-ESP32 3.x
; on ESP-IDF 5.5.x; see Docs/development/10-firmware-2026-baseline.md.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = pico32
framework = arduino
lib_ignore =
    Arduino_GFX
    GFX Library for Arduino
    FastLED-legacy
lib_deps =
    fastled/FastLED@^3.10.3
extra_scripts =
    pre:scripts/pio_arduino_esp32_3_compat.py

monitor_filters = esp32_exception_decoder
monitor_speed = 115200
; monitor_flags =
; 	--eol=CRLF
; 	--echo
; 	--filter=esp32_exception_decoder
build_flags =
    ; -D LV_FONT_MONTSERRAT_10=1
    -fPIC -Wreturn-type -Werror=return-type
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

upload_port = COM5
; upload_port = COM6
upload_speed = 921600
board_build.partitions = partitions-no-ota.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio


[env:HoloCubic_AIO_Debug]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
    -O0
    -D ARDUHAL_LOG_LEVEL=1



[env:HoloCubic_AIO_Releases]
extends = esp32_base
build_flags =
  ${esp32_base.build_flags}
    ; -O2

; ---------------------------------------------------------------------------
; Track B — host-side Unity unit tests (no Arduino framework, no hardware).
; Builds a tiny subset of firmware src (currently just driver/imu.cpp)
; against minimal stubs in test/stubs_unit/. Run locally:
;   pio test -e native_unit
; CI runs this in a separate `unit-tests` job parallel to gui-regression.
;
; Intentionally NOT extending [env]: that block sets platform=espressif32
; and framework=arduino, which we don't want for a native test build.
; ---------------------------------------------------------------------------
[env:native_unit]
platform = native@^1.1.3
test_framework = unity
; Exclude test_ftp_basic_commands — it lives in env:native_ftp because
; the FTP harness needs heavier stubs (String, IPAddress, scriptable
; WiFiServer/SD) that would bloat this lean unit-test build.
test_filter = native/* -native/test_ftp_basic_commands*
test_build_src = yes
; Disable LDF so PlatformIO doesn't auto-pull every vendored library
; under lib/ (lvgl, MPU6050, TFT_eSPI, etc.) into the unit-test build.
; lib_ignore turned out to be unreliable — it matches library.json's
; declared name, not the folder name. Declare Unity explicitly so it
; still gets pulled even with LDF off.
lib_ldf_mode = off
lib_deps =
  throwtheswitch/Unity@^2.6.1
build_src_filter =
  -<*>
  +<driver/imu.cpp>
  +<driver/analyse_param.cpp>
  +<app/game_2048/game2048_contorller.cpp>
  +<app/heartbeat/heartbeat_config_parse.cpp>
  +<sys/send_to_dispatch.cpp>
  ; Shared globals (Wire/Serial/mpu_fake_*/encoder_*) defined once,
  ; linked into every test binary so each test_main.cpp doesn't have
  ; to duplicate them just to satisfy imu.cpp's externs.
  +<../test/stubs_unit/test_globals.cpp>
build_flags =
  -std=c++14
  -I test/stubs_unit
  -I lib/ArduinoJson-7.x/src
  -I src

; ---------------------------------------------------------------------------
; Track C — host-side smoke tests for the vendored ESP32FtpServer class
; (PR-3.0a). Wires the real FtpServer source against a scriptable WiFi /
; SD stub set so the auth + command-dispatch state machine can be driven
; from a Unity test. Built+linked separately from native_unit because the
; FTP stubs are heavier (String, IPAddress, in-memory FS) and would slow
; the lean unit-test surface.
; Run locally:
;   pio test -e native_ftp
; CI runs this in the same job after native_unit.
; ---------------------------------------------------------------------------
[env:native_ftp]
platform = native@^1.1.3
test_framework = unity
test_filter = native/test_ftp_basic_commands*
test_build_src = yes
lib_ldf_mode = off
lib_deps =
  throwtheswitch/Unity@^2.6.1
build_src_filter =
  -<*>
  +<app/file_manager/ESP32FtpServer.cpp>
  +<app/file_manager/ESP32FtpServer_auth.cpp>
  +<app/file_manager/ESP32FtpServer_commands.cpp>
  +<app/file_manager/ESP32FtpServer_transfer.cpp>
  +<app/file_manager/ESP32FtpServer_util.cpp>
  +<../test/stubs_ftp/test_globals.cpp>
  +<../test/stubs_ftp/ftp_test_helpers.cpp>
build_flags =
  -std=c++14
  -I test/stubs_ftp
  -I src
