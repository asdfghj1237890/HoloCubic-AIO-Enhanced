<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">HoloCubic AIO firmware framework</title>
  <desc id="desc">Animated architecture diagram showing device services, AppController's hybrid event dispatch, and applications registered through the APP_OBJ contract.</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".55"/>
    </filter>
    <marker id="arrowCyan" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#7f9bad"/>
    </marker>
    <marker id="arrowViolet" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#7f9bad"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2.4px; }
      .section-title { fill: #f8fafc; font-size: 19px; font-weight: 750; }
      .label { fill: #f8fafc; font-size: 17px; font-weight: 650; }
      .meta { fill: #94a3b8; font-size: 13px; }
      .code { fill: #c3d0d8; font-family: "Cascadia Code", Consolas, monospace; font-size: 13px; }
      .rail { fill: none; stroke: #334155; stroke-width: 2; }
      .flow-cyan { fill: none; stroke: #7f9bad; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 4 12; marker-end: url(#arrowCyan); animation: travel 1.5s linear infinite; }
      .flow-violet { fill: none; stroke: #7f9bad; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 4 12; marker-end: url(#arrowViolet); animation: travel 1.5s linear infinite; }
      .core-ring { transform-box: fill-box; transform-origin: center; animation: breathe 2.8s ease-in-out infinite; }
      .status-dot { animation: blink 1.4s ease-in-out infinite; }
      .app-card > rect { animation: appScan 8s ease-in-out infinite; }
      .app-card:nth-of-type(2) > rect { animation-delay: -6.7s; }
      .app-card:nth-of-type(3) > rect { animation-delay: -5.4s; }
      .app-card:nth-of-type(4) > rect { animation-delay: -4.1s; }
      .app-card:nth-of-type(5) > rect { animation-delay: -2.8s; }
      .app-card:nth-of-type(6) > rect { animation-delay: -1.5s; }
      @keyframes travel { to { stroke-dashoffset: -32; } }
      @keyframes breathe { 0%,100% { opacity: .5; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
      @keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes appScan { 0%,12% { stroke: #9ab0bd; stroke-width: 2; } 18%,100% { stroke: #475569; stroke-width: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .flow-cyan, .flow-violet, .core-ring, .status-dot, .app-card { animation: none; }
      }
    </style>
  </defs>

  <rect width="1400" height="820" rx="26" fill="#111827"/>
  <rect width="1400" height="820" rx="26" fill="url(#grid)"/>

  <g aria-label="Diagram heading">
    <text x="52" y="58" fill="#8fa8b7" class="eyebrow">HOLOCUBIC AIO · FIRMWARE FRAMEWORK</text>
    <text x="52" y="94" fill="#f8fafc" font-size="29" font-weight="760">Drivers, controller services, and modular apps.</text>
    <text x="1348" y="58" text-anchor="end" fill="#64748b" font-size="13">ESP32-PICO-D4 · Arduino · LVGL 9</text>
  </g>

  <!-- Left: resources -->
  <g filter="url(#shadow)" aria-label="Hardware and shared resources">
    <rect x="48" y="138" width="310" height="582" rx="22" fill="#172033" stroke="#334155" stroke-width="1.5"/>
    <text x="76" y="178" fill="#8fa8b7" class="eyebrow">01 · DRIVERS + SERVICES</text>
    <text x="76" y="207" class="section-title">Device-facing resources</text>

    <g transform="translate(76 244)">
      <rect width="254" height="84" rx="14" fill="#1d2738" stroke="#3b4a5d"/>
      <circle cx="31" cy="30" r="12" fill="#263746" stroke="#7f9bad"/>
      <path d="M25 33c4-10 8-10 12 0M31 19v5" fill="none" stroke="#b8c7d1" stroke-width="2" stroke-linecap="round"/>
      <text x="55" y="32" class="label">MPU6050</text>
      <text x="55" y="55" class="meta">action input · 200 ms timer</text>
    </g>
    <g transform="translate(76 346)">
      <rect width="254" height="84" rx="14" fill="#1d2738" stroke="#3b4a5d"/>
      <circle cx="31" cy="30" r="12" fill="#263746" stroke="#7f9bad"/>
      <path d="M23 29a12 12 0 0 1 16 0M27 34a6 6 0 0 1 8 0M31 39h.1" fill="none" stroke="#b8c7d1" stroke-width="2" stroke-linecap="round"/>
      <text x="55" y="32" class="label">Network stack</text>
      <text x="55" y="55" class="meta">Wi-Fi on demand · HTTP/MQTT</text>
    </g>
    <g transform="translate(76 448)">
      <rect width="254" height="84" rx="14" fill="#1d2738" stroke="#3b4a5d"/>
      <circle cx="31" cy="30" r="12" fill="#263746" stroke="#7f9bad"/>
      <path d="M25 21h10l3 4v15H24V21zM28 21v7h6v-7" fill="none" stroke="#b8c7d1" stroke-width="1.8" stroke-linejoin="round"/>
      <text x="55" y="32" class="label">SD + SPIFFS</text>
      <text x="55" y="55" class="meta">media · config · cache</text>
    </g>
    <g transform="translate(76 550)">
      <rect width="254" height="84" rx="14" fill="#1d2738" stroke="#3b4a5d"/>
      <circle cx="31" cy="30" r="12" fill="#263746" stroke="#7f9bad"/>
      <circle cx="31" cy="30" r="8" fill="none" stroke="#b8c7d1" stroke-width="1.8"/>
      <path d="M31 25v6l4 2" fill="none" stroke="#b8c7d1" stroke-width="1.8" stroke-linecap="round"/>
      <text x="55" y="32" class="label">Display + RGB</text>
      <text x="55" y="55" class="meta">LVGL/TFT · separate RGB task</text>
    </g>
    <rect x="76" y="662" width="254" height="34" rx="9" fill="#202c3b"/>
    <circle class="status-dot" cx="94" cy="679" r="4" fill="#7f9bad"/>
    <text x="108" y="684" class="code">drivers + storage</text>
  </g>

  <!-- Resource rails -->
  <g aria-label="Animated resource flow">
    <path class="rail" d="M330 286C398 286 390 270 454 270"/>
    <path class="flow-cyan" d="M330 286C398 286 390 270 454 270"/>
    <path class="rail" d="M330 388C410 388 396 348 454 348"/>
    <path class="flow-cyan" d="M330 388C410 388 396 348 454 348" style="animation-delay:-.35s"/>
    <path class="rail" d="M330 490C420 490 402 426 454 426"/>
    <path class="flow-cyan" d="M330 490C420 490 402 426 454 426" style="animation-delay:-.7s"/>
    <path class="rail" d="M330 592C430 592 408 504 454 504"/>
    <path class="flow-cyan" d="M330 592C430 592 408 504 454 504" style="animation-delay:-1.05s"/>
  </g>

  <!-- Center: controller -->
  <g filter="url(#shadow)" aria-label="AppController event router">
    <rect x="454" y="138" width="420" height="582" rx="22" fill="#172033" stroke="#475569" stroke-width="1.5"/>
    <text x="482" y="178" fill="#8fa8b7" class="eyebrow">02 · EVENT ROUTER</text>
    <text x="482" y="207" class="section-title">Loop-task coordinator</text>

    <g class="core-ring">
      <rect x="500" y="242" width="328" height="166" rx="27" fill="none" stroke="#7f9bad" stroke-opacity=".28" stroke-width="9"/>
    </g>
    <rect x="510" y="252" width="308" height="146" rx="22" fill="#34495a" stroke="#7892a3"/>
    <circle cx="546" cy="288" r="10" fill="#dbeafe" fill-opacity=".18"/>
    <path d="M541 288h10M546 283v10" stroke="#e0f2fe" stroke-width="2" stroke-linecap="round"/>
    <text x="570" y="294" fill="#e0f2fe" font-size="13" font-weight="700" letter-spacing="1.2">RUNTIME CORE</text>
    <text x="664" y="338" text-anchor="middle" fill="#fff" font-size="30" font-weight="780">AppController</text>
    <text x="664" y="367" text-anchor="middle" fill="#dbeafe" class="code">main_process(act_info)</text>

    <g transform="translate(492 438)">
      <rect width="344" height="74" rx="15" fill="#1d2738" stroke="#475569"/>
      <circle cx="28" cy="27" r="5" fill="#7f9bad" class="status-dot"/>
      <text x="47" y="31" class="label">Hybrid message dispatch</text>
      <text x="47" y="54" class="code">network queued · config sync</text>
    </g>
    <g transform="translate(492 530)">
      <rect width="344" height="74" rx="15" fill="#1d2738" stroke="#475569"/>
      <path d="M22 22h14v14H22zM26 18h14v14" fill="none" stroke="#b8c7d1" stroke-width="1.7"/>
      <text x="47" y="31" class="label">Active-app lifecycle</text>
      <text x="47" y="54" class="code">launcher ⇄ active APP_OBJ</text>
    </g>
    <rect x="492" y="630" width="344" height="54" rx="13" fill="#202a3a" stroke="#526474" stroke-opacity=".8"/>
    <text x="664" y="653" text-anchor="middle" fill="#d6dee3" font-size="13" font-weight="650">core callbacks run on loop task</text>
    <text x="664" y="673" text-anchor="middle" fill="#9fafb9" font-size="12">return quickly · LVGL uses a mutex</text>
  </g>

  <!-- Controller-to-app rails -->
  <g aria-label="Animated app dispatch flow">
    <path class="rail" d="M818 325C890 325 879 270 944 270"/>
    <path class="flow-violet" d="M818 325C890 325 879 270 944 270"/>
    <path class="rail" d="M836 474C914 474 892 406 944 406"/>
    <path class="flow-violet" d="M836 474C914 474 892 406 944 406" style="animation-delay:-.55s"/>
    <path class="rail" d="M836 567C914 567 895 542 944 542"/>
    <path class="flow-violet" d="M836 567C914 567 895 542 944 542" style="animation-delay:-1.05s"/>
  </g>

  <!-- Right: apps -->
  <g filter="url(#shadow)" aria-label="APP_OBJ application ecosystem">
    <rect x="944" y="138" width="408" height="582" rx="22" fill="#172033" stroke="#475569" stroke-width="1.5"/>
    <text x="972" y="178" fill="#8fa8b7" class="eyebrow">03 · APP ECOSYSTEM</text>
    <text x="972" y="207" class="section-title">Apps register an APP_OBJ</text>

    <rect x="972" y="232" width="352" height="78" rx="14" fill="#202a3a" stroke="#526474"/>
    <text x="994" y="258" fill="#d6dee3" font-size="12" font-weight="700" letter-spacing="1.2">CALLBACK CONTRACT</text>
    <text x="994" y="285" class="code">init · process · background · exit</text>
    <text x="994" y="302" fill="#9fafb9" font-size="12">message_handle · metadata · callbacks may be null</text>

    <g class="app-card" transform="translate(972 336)">
      <rect width="166" height="76" rx="13" fill="#1b2940" stroke="#475569"/>
      <circle cx="24" cy="25" r="7" fill="#7f9bad"/>
      <text x="42" y="29" class="label">Weather</text>
      <text x="20" y="54" class="meta">clock + network</text>
    </g>
    <g class="app-card" transform="translate(1158 336)">
      <rect width="166" height="76" rx="13" fill="#1b2940" stroke="#475569"/>
      <circle cx="24" cy="25" r="7" fill="#7f9bad"/>
      <text x="42" y="29" class="label">Media</text>
      <text x="20" y="54" class="meta">photo + video</text>
    </g>
    <g class="app-card" transform="translate(972 430)">
      <rect width="166" height="76" rx="13" fill="#1b2940" stroke="#475569"/>
      <circle cx="24" cy="25" r="7" fill="#7f9bad"/>
      <text x="42" y="29" class="label">Web / FTP</text>
      <text x="20" y="54" class="meta">settings + files</text>
    </g>
    <g class="app-card" transform="translate(1158 430)">
      <rect width="166" height="76" rx="13" fill="#1b2940" stroke="#475569"/>
      <circle cx="24" cy="25" r="7" fill="#7f9bad"/>
      <text x="42" y="29" class="label">Markets</text>
      <text x="20" y="54" class="meta">stocks + PC stats</text>
    </g>
    <g class="app-card" transform="translate(972 524)">
      <rect width="166" height="76" rx="13" fill="#1b2940" stroke="#475569"/>
      <circle cx="24" cy="25" r="7" fill="#7f9bad"/>
      <text x="42" y="29" class="label">Games</text>
      <text x="20" y="54" class="meta">2048 + snake</text>
    </g>
    <g class="app-card" transform="translate(1158 524)">
      <rect width="166" height="76" rx="13" fill="#1b2940" stroke="#475569"/>
      <circle cx="24" cy="25" r="7" fill="#7f9bad"/>
      <text x="42" y="29" class="label">Your app</text>
      <text x="20" y="54" class="meta">same small contract</text>
    </g>

    <rect x="972" y="628" width="352" height="58" rx="13" fill="#202a3a" stroke="#526474"/>
    <text x="994" y="652" fill="#d6dee3" font-size="14" font-weight="700">Output paths</text>
    <text x="994" y="674" class="code">APP UI → LVGL → TFT · RGB task</text>
  </g>

  <g aria-label="Runtime legend">
    <rect x="48" y="756" width="1304" height="34" rx="10" fill="#0b1425" stroke="#1e293b"/>
    <circle cx="73" cy="773" r="4" fill="#7f9bad"/>
    <text x="87" y="778" fill="#94a3b8" font-size="12">service access</text>
    <circle cx="211" cy="773" r="4" fill="#a8b5bd"/>
    <text x="225" y="778" fill="#94a3b8" font-size="12">controller / app dispatch</text>
    <text x="1328" y="778" text-anchor="end" fill="#64748b" font-size="12">Animated paths show direction · honors reduced-motion preferences</text>
  </g>
</svg>
