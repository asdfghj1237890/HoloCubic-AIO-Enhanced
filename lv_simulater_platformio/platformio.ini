; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native_test

; ; Shared options


[env:AIO_emulator_64bits]
platform = native@^1.1.3
; platform = native
extra_scripts = support/sdl2_build_extra.py
build_flags =
  -D LV_CONF_SKIP
  -D LV_CONF_INCLUDE_SIMPLE
  ; Enable LVGL demo, remove when working on your own project
  -D LV_USE_DEMO_WIDGETS=1
  ; -D LV_LOG_LEVEL=LV_LOG_LEVEL_INFO
  -D LV_USE_LOG=1
  -D LV_LOG_PRINTF=1
  ; Add recursive dirs for hal headers search
  !python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/sdl2')]))"
  -lSDL2
  ; SDL drivers options
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_DRV_NO_CONF
  -D USE_SDL
  -D SDL_HOR_RES=240
  -D SDL_VER_RES=240  
  -D SDL_ZOOM=1
  -D SDL_INCLUDE_PATH="\"SDL2/SDL.h\""
  -D LV_THEME_DEFAULT_DARK=1

  ; LVGL memory options, setup for the demo to run properly
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_SIZE="(128U * 1024U)"
  
lib_deps =
  lvgl=https://github.com/lvgl/lvgl/archive/refs/tags/v8.3.3.zip
  ; Use direct URL, because package registry is unstable
  ;lv_drivers@~7.9.0
  lv_drivers=https://github.com/lvgl/lv_drivers/archive/refs/tags/v8.2.0.zip
  ;lv_drivers@~6.1
build_src_filter =
  +<*>
  +<../hal/sdl2>
  ; Force compile LVGL demo, remove when working on your own project
  +<../.pio/libdeps/AIO_emulator_64bits/lvgl/demos>

lib_archive = false


; ---------------------------------------------------------------------------
; HoloCubic_AIO regression-test harness — host-side build (Track A).
; Renders the actual firmware app code into the SDL2 window via lv_drivers.
; See test/harness/main.cpp and the README at test/README.md.
; ---------------------------------------------------------------------------
[env:native_test]
platform = native@^1.1.3
extra_scripts = support/sdl2_build_extra.py
build_flags =
  -D LV_CONF_SKIP
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_USE_LOG=1
  -D LV_LOG_PRINTF=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_DRV_NO_CONF
  -D USE_SDL
  -D SDL_HOR_RES=240
  -D SDL_VER_RES=240
  -D SDL_ZOOM=1
  -D SDL_INCLUDE_PATH="\"SDL2/SDL.h\""
  -D LV_THEME_DEFAULT_DARK=1
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_SIZE="(128U * 1024U)"
  -D LV_USE_SNAPSHOT=1
  -D AIO_NATIVE_TEST=1
  ; Stub headers must precede firmware src so our shims win.
  -I ../test/stubs
  -I ../test/harness
  -I ../AIO_Firmware_PIO/src
  ; SDL2 HAL helpers from lv_drivers (sdl_init / sdl_display_flush).
  -I hal/sdl2
  -lSDL2

build_src_filter =
  ; Drop the existing simulator's main.cpp / bsp_mylvgl etc.
  -<*>
  ; SDL2 HAL helpers from lv_drivers (sdl_init / sdl_display_flush).
  +<../hal/sdl2>
  ; Our test harness + stubs runtime.
  +<../../test/harness>
  +<../../test/stubs/stubs_runtime.cpp>
  ; Apps under test (Phase 4 expands this list per scenario coverage).
  +<../../AIO_Firmware_PIO/src/app/anniversary>
  +<../../AIO_Firmware_PIO/src/app/tomato>
  +<../../AIO_Firmware_PIO/src/app/game_2048>
  +<../../AIO_Firmware_PIO/src/app/heartbeat>
  +<../../AIO_Firmware_PIO/src/app/settings>
  +<../../AIO_Firmware_PIO/src/app/game_snake>
  ; settings depends on the firmware-side message.{h,cpp}.
  +<../../AIO_Firmware_PIO/src/message.cpp>
  ; Shared fonts pulled in from the weather app (used by anniversary +
  ; tomato — keep here so we don't have to drag the whole weather build in).
  +<../../AIO_Firmware_PIO/src/app/weather/lv_font_ibmplex_115.c>
  +<../../AIO_Firmware_PIO/src/app/weather/lv_font_ibmplex_64.c>

lib_deps =
  lvgl=https://github.com/lvgl/lvgl/archive/refs/tags/v8.3.3.zip
  lv_drivers=https://github.com/lvgl/lv_drivers/archive/refs/tags/v8.2.0.zip

lib_archive = false




