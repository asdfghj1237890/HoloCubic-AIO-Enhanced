; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native_test

; ; Shared options


[env:AIO_emulator_64bits]
platform = native@^1.1.3
; platform = native
extra_scripts = support/sdl2_build_extra.py
build_flags =
  -D LV_CONF_SKIP
  -D LV_CONF_INCLUDE_SIMPLE
  ; Enable LVGL demo, remove when working on your own project
  -D LV_USE_DEMO_WIDGETS=1
  ; -D LV_LOG_LEVEL=LV_LOG_LEVEL_INFO
  -D LV_USE_LOG=1
  -D LV_LOG_PRINTF=1
  ; Add recursive dirs for hal headers search
  !python -c "import os; print(' '.join(['-I {}'.format(i[0].replace('\x5C','/')) for i in os.walk('hal/sdl2')]))"
  -lSDL2
  ; SDL drivers options
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_DRV_NO_CONF
  -D USE_SDL
  -D SDL_HOR_RES=240
  -D SDL_VER_RES=240  
  -D SDL_ZOOM=1
  -D SDL_INCLUDE_PATH="\"SDL2/SDL.h\""
  -D LV_THEME_DEFAULT_DARK=1

  ; LVGL memory options, setup for the demo to run properly
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_SIZE="(128U * 1024U)"
  
lib_deps =
  lvgl=https://github.com/lvgl/lvgl/archive/refs/tags/v8.3.3.zip
  ; Use direct URL, because package registry is unstable
  ;lv_drivers@~7.9.0
  lv_drivers=https://github.com/lvgl/lv_drivers/archive/refs/tags/v8.2.0.zip
  ;lv_drivers@~6.1
build_src_filter =
  +<*>
  +<../hal/sdl2>
  ; Force compile LVGL demo, remove when working on your own project
  +<../.pio/libdeps/AIO_emulator_64bits/lvgl/demos>

lib_archive = false


; ---------------------------------------------------------------------------
; HoloCubic_AIO regression-test harness — host-side build (Track A).
; Renders the actual firmware app code into the SDL2 window via lv_drivers.
; See test/harness/main.cpp and the README at test/README.md.
; ---------------------------------------------------------------------------
[env:native_test]
platform = native@^1.1.3
extra_scripts = support/sdl2_build_extra.py
build_flags =
  -D LV_CONF_SKIP
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_USE_LOG=1
  -D LV_LOG_PRINTF=1
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -D LV_DRV_NO_CONF
  -D USE_SDL
  -D SDL_HOR_RES=240
  -D SDL_VER_RES=240
  -D SDL_ZOOM=1
  -D SDL_INCLUDE_PATH="\"SDL2/SDL.h\""
  -D LV_THEME_DEFAULT_DARK=1
  -D LV_MEM_CUSTOM=1
  -D LV_MEM_SIZE="(128U * 1024U)"
  -D LV_USE_SNAPSHOT=1
  ; Montserrat sizes used by app GUIs not on by default in lvgl base:
  ; 14 -> stockmarket OpenQuo/MaxQuo/MinQuo/CloseQuo (default font for smaller
  ;   value labels; also bilibili / weather / pc_resource numeric rows),
  ; 20 -> settings, 24 -> game_snake, 30 -> settings, 40 -> bilibili,
  ; 48 -> stockmarket nowQuoLabel.
  -D LV_FONT_MONTSERRAT_14=1
  -D LV_FONT_MONTSERRAT_20=1
  -D LV_FONT_MONTSERRAT_24=1
  -D LV_FONT_MONTSERRAT_30=1
  -D LV_FONT_MONTSERRAT_40=1
  -D LV_FONT_MONTSERRAT_48=1
  ; Match the firmware's lv_conf.h: route lv_label_set_text_fmt's
  ; printf-style formatting to stdio's vsnprintf (which supports %f) so
  ; numeric values render on host. Default LVGL behaviour skips %f
  ; entirely, leaving a literal "f" artifact on every formatted label —
  ; which made stockmarket/weather/pc_resource value-display regressions
  ; invisible to the golden suite (e.g. PR-1.6b's vol/turnover bug).
  -D LV_SPRINTF_CUSTOM=1
  -D AIO_NATIVE_TEST=1
  ; firmware code has a few cast-from-void*-to-int patterns that are
  ; valid on 32-bit ESP32 but truncate on a 64-bit host. -fpermissive
  ; downgrades those to warnings rather than rewriting firmware code.
  -fpermissive
  ; -rdynamic exports symbols so glibc backtrace_symbols_fd in the
  ; harness's SIGSEGV handler can print readable function names.
  ; -g lets addr2line resolve the +0xN offsets to file:line in CI.
  -rdynamic
  -g
  ; ArduinoJson is header-only; vendored copy lives under lib/.
  -I ../AIO_Firmware_PIO/lib/ArduinoJson-7.x/src
  ; Force the Arduino-String adapter (uses c_str()+length() — already
  ; satisfied by our stub String). Without ARDUINO defined, the library
  ; otherwise picks the default Reader that needs read()/readBytes().
  ; STREAM + PRINT disabled so we don't drag in Stream/Print adapters.
  -D ARDUINOJSON_ENABLE_ARDUINO_STRING=1
  -D ARDUINOJSON_ENABLE_ARDUINO_STREAM=0
  -D ARDUINOJSON_ENABLE_ARDUINO_PRINT=0
  ; Stub headers must precede firmware src so our shims win.
  -I ../test/stubs
  -I ../test/harness
  -I ../AIO_Firmware_PIO/src
  ; SDL2 HAL helpers from lv_drivers (sdl_init / sdl_display_flush).
  -I hal/sdl2
  -lSDL2

build_src_filter =
  ; Drop the existing simulator's main.cpp / bsp_mylvgl etc.
  -<*>
  ; SDL2 HAL helpers from lv_drivers (sdl_init / sdl_display_flush).
  +<../hal/sdl2>
  ; Our test harness + stubs runtime.
  +<../../test/harness>
  +<../../test/stubs/stubs_runtime.cpp>
  ; Apps under test (Phase 4 expands this list per scenario coverage).
  +<../../AIO_Firmware_PIO/src/app/anniversary>
  +<../../AIO_Firmware_PIO/src/app/tomato>
  +<../../AIO_Firmware_PIO/src/app/game_2048>
  +<../../AIO_Firmware_PIO/src/app/heartbeat>
  +<../../AIO_Firmware_PIO/src/app/settings>
  +<../../AIO_Firmware_PIO/src/app/game_snake>
  +<../../AIO_Firmware_PIO/src/app/example>
  +<../../AIO_Firmware_PIO/src/app/bilibili_fans>
  +<../../AIO_Firmware_PIO/src/app/weather>
  +<../../AIO_Firmware_PIO/src/app/weather_old>
  +<../../AIO_Firmware_PIO/src/app/stockmarket>
  ; file_manager: ESP32FtpServer.cpp uses standard WiFiServer/WiFiClient
  ; APIs (already stubbed); ftpServer.begin() + handleFTP() are no-ops on
  ; host (no real socket). Skip the bundled .ino sketch and the .cpp_back
  ; backup file.
  +<../../AIO_Firmware_PIO/src/app/file_manager>
  -<../../AIO_Firmware_PIO/src/app/file_manager/ESP32_FTPServer_SD.ino>
  -<../../AIO_Firmware_PIO/src/app/file_manager/file_manager.cpp_back>
  +<../../AIO_Firmware_PIO/src/app/server>
  +<../../AIO_Firmware_PIO/src/app/idea_anim>
  ; LHLXW's main_process is an internal while(1) loop that polls firmware
  ; globals (act_info / isCheckAction / mpu) instead of using the per-tick
  ; parameter, so it can't be driven the normal harness way. Build it in
  ; for the init-only smoke (test/scenarios/LHLXW/smoke.scn).
  ; emoji subdir is excluded — it depends on MjpegPlayDecoder from the
  ; deferred media_player tree. emoji_process gets a no-op stub in
  ; stubs_runtime.cpp so LHLXW.cpp's reference still links.
  +<../../AIO_Firmware_PIO/src/app/LHLXW>
  -<../../AIO_Firmware_PIO/src/app/LHLXW/emoji>
  +<../../AIO_Firmware_PIO/src/app/screen_share>
  +<../../AIO_Firmware_PIO/src/app/pc_resource>
  +<../../AIO_Firmware_PIO/src/app/picture>
  ; media_player — DMADrawer.cpp uses ESP-IDF SPI/GPIO directly
  ; (gpio_num_t, spi_bus_initialize, spi_device_handle_t etc), but its
  ; references in mjpeg_decoder.cpp / rgb_decoder.cpp are all commented
  ; out, so we exclude DMADrawer.cpp and the rest builds + links cleanly
  ; against existing TFT_eSPI / TJpg_Decoder / SD stubs. tf.listDir
  ; returns nullptr on host so init's video_start no-ops and process'
  ; first tick auto-exits via `if (NULL == pfile) sys->app_exit()`.
  +<../../AIO_Firmware_PIO/src/app/media_player>
  -<../../AIO_Firmware_PIO/src/app/media_player/DMADrawer.cpp>
  ; settings depends on the firmware-side message.{h,cpp}.
  +<../../AIO_Firmware_PIO/src/message.cpp>
  ; Phase 2 shared HTTP/JSON helper. Added empty in PR-2.1 (no callers
  ; yet); per-app migrations in PR-2.2a/b + PR-2.3a/b + PR-2.4 will
  ; wire each fetch site over to it.
  +<../../AIO_Firmware_PIO/src/http_util.cpp>
  ; Shared fonts pulled in from the weather app (used by anniversary +
  ; tomato — keep here so we don't have to drag the whole weather build in).
  +<../../AIO_Firmware_PIO/src/app/weather/lv_font_ibmplex_115.c>
  +<../../AIO_Firmware_PIO/src/app/weather/lv_font_ibmplex_64.c>
  ; Chinese font shared by weather + stockmarket.
  +<../../AIO_Firmware_PIO/src/resource/font/ch_font20.c>

lib_deps =
  lvgl=https://github.com/lvgl/lvgl/archive/refs/tags/v8.3.3.zip
  lv_drivers=https://github.com/lvgl/lv_drivers/archive/refs/tags/v8.2.0.zip

lib_archive = false




