name: Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "compare (default) or update-golden (regenerate baselines as artifact)"
        type: choice
        default: compare
        options:
          - compare
          - update-golden

jobs:
  gui-regression:
    name: GUI regression (SDL2 host harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # Cache PIO global tools/platforms + the project's downloaded libs.
      # Massive speed-up on cache hit and avoids the GitHub-archive 502s
      # that bit us on the lv_drivers download (run #25070427104).
      - name: Cache PlatformIO data
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            lv_simulater_platformio/.pio
          key: pio-gui-${{ runner.os }}-${{ hashFiles('lv_simulater_platformio/platformio.ini') }}
          restore-keys: |
            pio-gui-${{ runner.os }}-

      # Retry with backoff to absorb transient GitHub-archive download
      # failures (502/503/timeouts) when PlatformIO fetches libs.
      - name: Build env:native_test
        working-directory: lv_simulater_platformio
        run: |
          set +e
          for attempt in 1 2 3; do
            pio run -e native_test
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "::notice::Build succeeded on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              sleep_for=$((attempt * 15))
              echo "::warning::Build failed (rc=$rc) on attempt $attempt/3; retrying in ${sleep_for}s..."
              sleep $sleep_for
            fi
          done
          echo "::error::Build failed after 3 attempts"
          exit 1

      - name: Run scenario suite
        working-directory: lv_simulater_platformio
        env:
          SDL_VIDEODRIVER: dummy
        timeout-minutes: 5
        run: |
          set -e
          flags="--headless"
          if [ "${{ inputs.mode }}" = "update-golden" ]; then
            flags="$flags --update-golden"
          fi
          BIN=./.pio/build/native_test/program
          for scn in ../test/scenarios/*/*.scn; do
            echo "::group::scenario $scn"
            # Run without `if !` so $? reflects the real exit status (the `!`
            # form negates the pipeline status to 0/1, hiding rc=139).
            rc=0
            "$BIN" --scenario "$scn" $flags 2> stderr.log || rc=$?
            cat stderr.log
            if [ $rc -ne 0 ]; then
              # On segfault (rc=139) decode the +0xN frames via addr2line so
              # the trace shows file:line in the firmware/harness sources.
              if [ $rc -eq 139 ]; then
                echo "--- addr2line trace ---"
                grep -oE '\+0x[0-9a-f]+' stderr.log | sort -u | while read off; do
                  echo -n "$off  "
                  addr2line -Cfe "$BIN" "${off#+}" || true
                done
              fi
              exit $rc
            fi
            echo "::endgroup::"
          done

      # Always upload — review-time inspection of "actual" PNGs and any diff
      # PNGs is how human reviewers approve a UI change.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: test/results/**
          if-no-files-found: ignore
          retention-days: 14

      # Only meaningful when running in --update-golden mode; the freshly
      # written PNGs land here for the operator to download + commit.
      - name: Upload regenerated goldens
        if: always() && inputs.mode == 'update-golden'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-goldens
          path: test/golden/**
          if-no-files-found: ignore
          retention-days: 14

  # Track B: Unity unit tests over pure-logic firmware modules
  # (currently driver/imu.cpp's getAction). Runs in parallel with the
  # GUI regression job; a failure here blocks the PR independently.
  unit-tests:
    name: Unit tests (PlatformIO Unity, native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # Cache PIO global tools + AIO_Firmware_PIO's libdeps for the
      # native_unit env so transient archive 502s don't block the build.
      - name: Cache PlatformIO data
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            AIO_Firmware_PIO/.pio
          key: pio-unit-${{ runner.os }}-${{ hashFiles('AIO_Firmware_PIO/platformio.ini') }}
          restore-keys: |
            pio-unit-${{ runner.os }}-

      # Retry with backoff against transient download failures.
      - name: Run Unity tests (env:native_unit)
        working-directory: AIO_Firmware_PIO
        timeout-minutes: 5
        run: |
          set +e
          for attempt in 1 2 3; do
            pio test -e native_unit
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "::notice::Tests succeeded on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              sleep_for=$((attempt * 15))
              echo "::warning::Tests failed (rc=$rc) on attempt $attempt/3; retrying in ${sleep_for}s..."
              sleep $sleep_for
            fi
          done
          echo "::error::Tests failed after 3 attempts"
          exit 1
