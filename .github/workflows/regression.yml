name: Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "compare (default) or update-golden (regenerate baselines as artifact)"
        type: choice
        default: compare
        options:
          - compare
          - update-golden

jobs:
  gui-regression:
    name: GUI regression (SDL2 host harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build env:native_test
        working-directory: lv_simulater_platformio
        run: pio run -e native_test

      - name: Run anniversary smoke scenario
        working-directory: lv_simulater_platformio
        env:
          SDL_VIDEODRIVER: dummy
        timeout-minutes: 2
        run: |
          if [ "${{ inputs.mode }}" = "update-golden" ]; then
            ./.pio/build/native_test/program \
              --scenario ../test/scenarios/anniversary/smoke.scn \
              --headless --update-golden
          else
            ./.pio/build/native_test/program \
              --scenario ../test/scenarios/anniversary/smoke.scn \
              --headless
          fi

      # Always upload — review-time inspection of "actual" PNGs and any diff
      # PNGs is how human reviewers approve a UI change.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: test/results/**
          if-no-files-found: ignore
          retention-days: 14

      # Only meaningful when running in --update-golden mode; the freshly
      # written PNGs land here for the operator to download + commit.
      - name: Upload regenerated goldens
        if: always() && inputs.mode == 'update-golden'
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-goldens
          path: test/golden/**
          if-no-files-found: ignore
          retention-days: 14
