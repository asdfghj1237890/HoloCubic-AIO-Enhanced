name: AIO_Tool

# Python upper-computer tool checks: pytest + ruff format + ruff lint.
# Triggered only when AIO_Tool/ files (or this workflow) change, so firmware-only
# PRs aren't slowed down by Python setup.
on:
  push:
    branches: [main]
    paths:
      - "AIO_Tool/**"
      - ".github/workflows/aio-tool.yml"
  pull_request:
    branches: [main]
    paths:
      - "AIO_Tool/**"
      - ".github/workflows/aio-tool.yml"
  workflow_dispatch:

# Opt all JS-based actions in this workflow into Node.js 24 ahead of the
# 2026-06-02 forced default, silencing the deprecation warning. See
# .github/workflows/regression.yml for the full context.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  python-checks:
    name: pytest + ruff (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AIO_Tool

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "AIO_Tool/uv.lock"

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Run pytest
        env:
          PYTHONIOENCODING: utf-8
        run: uv run pytest -v

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .
