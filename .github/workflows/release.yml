name: Release Firmware and Tool

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.firmware_version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.x"

      - name: Extract firmware version
        id: firmware_version
        run: |
          version=$(grep -Po '(?<=#define AIO_VERSION ")[^"]+' AIO_Firmware_PIO/src/common.h)
          if [ -z "$version" ]; then
            echo "AIO_VERSION not found" >&2
            exit 1
          fi
          echo "value=$version" >> $GITHUB_OUTPUT

      - name: Build firmware
        working-directory: AIO_Firmware_PIO
        run: uvx platformio run --environment HoloCubic_AIO_Releases

      - name: Package firmware artifact
        # Filename uses the release tag (github.ref_name) for consistency
        # across all 5 assets in a release. The internal AIO_VERSION
        # (firmware_version output) still feeds into the release body.
        run: |
          mkdir -p release
          cp AIO_Firmware_PIO/.pio/build/HoloCubic_AIO_Releases/firmware.bin release/HoloCubic_AIO_firmware_${{ github.ref_name }}.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: release/HoloCubic_AIO_firmware_${{ github.ref_name }}.bin
          if-no-files-found: error

  build_tool:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.tool_version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.x"
          enable-cache: true
          cache-dependency-glob: "AIO_Tool/uv.lock"

      - name: Extract tool version
        id: tool_version
        shell: pwsh
        run: |
          # Allow optional ': str' type annotation: e.g. TOOL_VERSION: str = "v2.5.0"
          $match = Select-String -Path "AIO_Tool\util\common.py" -Pattern 'TOOL_VERSION[^=]*=\s*"([^"]+)"' -AllMatches
          if (-not $match) {
            Write-Error "TOOL_VERSION not found"
            exit 1
          }
          $version = $match.Matches[0].Groups[1].Value
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare Python environment
        working-directory: AIO_Tool
        shell: pwsh
        run: uv sync --all-groups --frozen

      - name: Build executable
        working-directory: AIO_Tool
        shell: pwsh
        run: |
          $spec = Join-Path $PWD "CubicAIO_Tool.spec"
          if (-not (Test-Path $spec)) {
            Get-ChildItem
            throw "Spec file not found at $spec"
          }
          uv run pyinstaller $spec

      - name: Package tool artifact
        # Filename uses the release tag (github.ref_name); the internal
        # TOOL_VERSION (tool_version output) still feeds into the release body.
        shell: pwsh
        run: |
          $artifactDir = "release"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $tag = "${{ github.ref_name }}"
          Copy-Item -Path "AIO_Tool\dist\CubicAIO_Tool.exe" -Destination (Join-Path $artifactDir ("HoloCubic_AIO_Tool_$tag.exe")) -Force

      - name: Upload tool artifact
        uses: actions/upload-artifact@v4
        with:
          name: tool
          path: release/HoloCubic_AIO_Tool_${{ github.ref_name }}.exe
          if-no-files-found: error

  publish_release:
    runs-on: ubuntu-latest
    needs:
      - build_firmware
      - build_tool
    steps:
      # Need the repo for the dist/ boot+partition bin files (3 small files
      # checked in for from-scratch ESP32 flashing). See dist/README.md.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: release

      - name: Download tool artifact
        uses: actions/download-artifact@v4
        with:
          name: tool
          path: release

      - name: Stage boot/partition bins
        run: |
          cp dist/bootloader_qio_80m.bin release/
          cp dist/partitions.bin         release/
          cp dist/boot_app0.bin          release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: HoloCubic AIO ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Files
            | File | Flash address | Notes |
            |---|---|---|
            | `HoloCubic_AIO_firmware_${{ github.ref_name }}.bin` | `0x10000` | Application firmware (internal AIO_VERSION = `${{ needs.build_firmware.outputs.version }}`) |
            | `HoloCubic_AIO_Tool_${{ github.ref_name }}.exe` | — | Windows GUI flasher (internal TOOL_VERSION = `${{ needs.build_tool.outputs.version }}`) |
            | `bootloader_qio_80m.bin` | `0x1000` | ESP32 second-stage bootloader |
            | `partitions.bin` | `0x8000` | Custom partition table (HoloCubic AIO layout) |
            | `boot_app0.bin` | `0xe000` | OTA boot selector |

            For first-time flash, drag all four `.bin` into the AIO Tool's 韌體刷寫 tab at the addresses above.
            See [dist/README.md](https://github.com/asdfghj1237890/HoloCubic-AIO-Enhanced/blob/main/dist/README.md) for esptool CLI usage.

            See [AIO_Tool/CHANGELOG.md](https://github.com/asdfghj1237890/HoloCubic-AIO-Enhanced/blob/main/AIO_Tool/CHANGELOG.md) for tool changes.
          files: |
            release/HoloCubic_AIO_firmware_${{ github.ref_name }}.bin
            release/HoloCubic_AIO_Tool_${{ github.ref_name }}.exe
            release/bootloader_qio_80m.bin
            release/partitions.bin
            release/boot_app0.bin

