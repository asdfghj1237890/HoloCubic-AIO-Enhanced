name: Release Firmware and Tool

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Opt all JS-based actions in this workflow into Node.js 24 ahead of the
# 2026-06-02 forced default, silencing the deprecation warning. See
# .github/workflows/regression.yml for the full context.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.firmware_version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.x"

      - name: Extract firmware version
        id: firmware_version
        run: |
          version=$(grep -Po '(?<=#define AIO_VERSION ")[^"]+' AIO_Firmware_PIO/src/common.h)
          if [ -z "$version" ]; then
            echo "AIO_VERSION not found" >&2
            exit 1
          fi
          echo "value=$version" >> $GITHUB_OUTPUT

      - name: Build firmware
        working-directory: AIO_Firmware_PIO
        run: uvx platformio run --environment HoloCubic_AIO_Releases

      - name: Package firmware artifact
        # Filename uses the release tag (github.ref_name) for consistency
        # across all 5 assets in a release. The internal AIO_VERSION
        # (firmware_version output) still feeds into the release body.
        run: |
          mkdir -p release
          cp AIO_Firmware_PIO/.pio/build/HoloCubic_AIO_Releases/firmware.bin release/HoloCubic_AIO_firmware_${{ github.ref_name }}.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: release/HoloCubic_AIO_firmware_${{ github.ref_name }}.bin
          if-no-files-found: error

  build_tool:
    name: build_tool (${{ matrix.target.os }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: windows-latest
            artifact_name: CubicAIO_Tool-${{ github.ref_name }}-x86_64-windows.exe
            staged_relative_path: aio-tool.exe
            shell: pwsh
          - os: macos-latest
            artifact_name: CubicAIO_Tool-${{ github.ref_name }}-aarch64-macos.tar.gz
            staged_relative_path: aio-tool
            shell: bash
          - os: ubuntu-22.04
            artifact_name: CubicAIO_Tool-${{ github.ref_name }}-x86_64-linux.tar.gz
            staged_relative_path: aio-tool
            shell: bash
    runs-on: ${{ matrix.target.os }}
    outputs:
      version: ${{ steps.tool_version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libudev-dev (Linux only)
        if: matrix.target.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: AIO_Tool

      - name: Extract tool version (Cargo.toml workspace.package.version)
        id: tool_version
        shell: bash
        run: |
          version=$(grep -E '^version = ' AIO_Tool/Cargo.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          if [ -z "$version" ]; then
            echo "workspace.package.version not found" >&2
            exit 1
          fi
          echo "value=$version" >> $GITHUB_OUTPUT

      - name: cargo build --release --bin aio-tool
        working-directory: AIO_Tool
        run: cargo build --release --bin aio-tool

      - name: Package tool artifact (Windows)
        if: matrix.target.os == 'windows-latest'
        shell: pwsh
        run: |
          $artifactDir = "release"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $src = "AIO_Tool\target\release\aio-tool.exe"
          if (-not (Test-Path $src)) { throw "expected $src" }
          Copy-Item -Path $src -Destination (Join-Path $artifactDir "${{ matrix.target.artifact_name }}") -Force

      - name: Package tool artifact (Linux / macOS tar.gz)
        if: matrix.target.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p release
          src=AIO_Tool/target/release/aio-tool
          if [ ! -x "$src" ]; then
            echo "expected executable at $src" >&2
            exit 1
          fi
          mkdir -p stage
          cp "$src" stage/aio-tool
          chmod +x stage/aio-tool
          tar -C stage -czf release/${{ matrix.target.artifact_name }} aio-tool

      - name: Upload tool artifact
        uses: actions/upload-artifact@v4
        with:
          name: tool-${{ matrix.target.os }}
          path: release/${{ matrix.target.artifact_name }}
          if-no-files-found: error

  publish_release:
    runs-on: ubuntu-latest
    needs:
      - build_firmware
      - build_tool
    steps:
      # Need the repo for the dist/ boot+partition bin files (3 small files
      # checked in for from-scratch ESP32 flashing). See dist/README.md.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: release

      - name: Download Windows tool artifact
        uses: actions/download-artifact@v4
        with:
          name: tool-windows-latest
          path: release

      - name: Download macOS tool artifact
        uses: actions/download-artifact@v4
        with:
          name: tool-macos-latest
          path: release

      - name: Download Linux tool artifact
        uses: actions/download-artifact@v4
        with:
          name: tool-ubuntu-22.04
          path: release

      - name: Stage boot/partition bins
        run: |
          cp dist/bootloader_qio_80m.bin release/
          cp dist/partitions.bin         release/
          cp dist/boot_app0.bin          release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: HoloCubic AIO ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Files
            | File | Flash address | Notes |
            |---|---|---|
            | `HoloCubic_AIO_firmware_${{ github.ref_name }}.bin` | `0x10000` | Application firmware (internal AIO_VERSION = `${{ needs.build_firmware.outputs.version }}`) |
            | `CubicAIO_Tool-${{ github.ref_name }}-x86_64-windows.exe` | — | Windows GUI flasher (Rust, unsigned — SmartScreen warning expected) |
            | `CubicAIO_Tool-${{ github.ref_name }}-aarch64-macos.tar.gz` | — | macOS Apple-Silicon binary inside tar.gz (unsigned — Gatekeeper warning, right-click → Open on first launch) |
            | `CubicAIO_Tool-${{ github.ref_name }}-x86_64-linux.tar.gz` | — | Linux x86_64 binary (requires `libudev` at runtime — install `libudev1` on Debian/Ubuntu, `systemd-libs` on Fedora) |
            | `bootloader_qio_80m.bin` | `0x1000` | ESP32 second-stage bootloader |
            | `partitions.bin` | `0x8000` | Custom partition table (HoloCubic AIO layout) |
            | `boot_app0.bin` | `0xe000` | OTA boot selector |

            For first-time flash, place all four `.bin` files at the addresses above (the Windows tool's Flasher tab can do this in one click).
            See [dist/README.md](https://github.com/asdfghj1237890/HoloCubic-AIO-Enhanced/blob/main/dist/README.md) for esptool CLI usage.

            Internal tool version: `${{ needs.build_tool.outputs.version }}` (from `AIO_Tool/Cargo.toml`).

            See [AIO_Tool/CHANGELOG.md](https://github.com/asdfghj1237890/HoloCubic-AIO-Enhanced/blob/main/AIO_Tool/CHANGELOG.md) for tool changes.
          files: |
            release/HoloCubic_AIO_firmware_${{ github.ref_name }}.bin
            release/CubicAIO_Tool-${{ github.ref_name }}-x86_64-windows.exe
            release/CubicAIO_Tool-${{ github.ref_name }}-aarch64-macos.tar.gz
            release/CubicAIO_Tool-${{ github.ref_name }}-x86_64-linux.tar.gz
            release/bootloader_qio_80m.bin
            release/partitions.bin
            release/boot_app0.bin
