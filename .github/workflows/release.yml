name: Release Firmware and Tool

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Opt all JS-based actions in this workflow into Node.js 24 ahead of the
# 2026-06-02 forced default, silencing the deprecation warning. See
# .github/workflows/regression.yml for the full context.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.firmware_version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.x"

      - name: Extract firmware version
        id: firmware_version
        run: |
          version=$(grep -Po '(?<=#define AIO_VERSION ")[^"]+' AIO_Firmware_PIO/src/common.h)
          if [ -z "$version" ]; then
            echo "AIO_VERSION not found" >&2
            exit 1
          fi
          echo "value=$version" >> $GITHUB_OUTPUT

      - name: Build firmware
        working-directory: AIO_Firmware_PIO
        run: uvx platformio run --environment HoloCubic_AIO_Releases

      - name: Package firmware artifact
        # Filename uses the release tag (github.ref_name) for consistency
        # across all 5 assets in a release. The internal AIO_VERSION
        # (firmware_version output) still feeds into the release body.
        run: |
          mkdir -p release
          cp AIO_Firmware_PIO/.pio/build/HoloCubic_AIO_Releases/firmware.bin release/HoloCubic_AIO_firmware_${{ github.ref_name }}.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: release/HoloCubic_AIO_firmware_${{ github.ref_name }}.bin
          if-no-files-found: error

  build_tool:
    # Studio (Tauri 2) bundle. Replaces the legacy `cargo build --bin aio-tool`
    # egui packaging — Studio is the shipping UI as of this PR. Each OS produces
    # the platform-native installer/image (NSIS / DMG / AppImage); the raw binary
    # ships inside the bundle.
    name: build_tool (${{ matrix.target.os }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: windows-latest
            bundle: nsis
            bundle_glob: 'AIO_Tool/studio/target/release/bundle/nsis/*-setup.exe'
            artifact_name: CubicAIO_Tool-${{ github.ref_name }}-x86_64-windows-setup.exe
          - os: macos-latest
            bundle: dmg
            bundle_glob: 'AIO_Tool/studio/target/release/bundle/dmg/*.dmg'
            artifact_name: CubicAIO_Tool-${{ github.ref_name }}-aarch64-macos.dmg
          - os: ubuntu-22.04
            bundle: appimage
            bundle_glob: 'AIO_Tool/studio/target/release/bundle/appimage/*.AppImage'
            artifact_name: CubicAIO_Tool-${{ github.ref_name }}-x86_64-linux.AppImage
    runs-on: ${{ matrix.target.os }}
    outputs:
      version: ${{ steps.tool_version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux deps (webkit2gtk for Tauri + libudev for serialport)
        if: matrix.target.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev

      # Studio's rust-toolchain.toml pins stable (1.85+ for Tauri 2's edition2024
      # transitive deps). Don't override.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: AIO_Tool/studio

      - name: Install tauri-cli
        run: cargo install tauri-cli --version ^2.0 --locked

      - name: Extract tool version (Cargo.toml workspace.package.version)
        id: tool_version
        shell: bash
        run: |
          version=$(grep -E '^version = ' AIO_Tool/Cargo.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
          if [ -z "$version" ]; then
            echo "workspace.package.version not found" >&2
            exit 1
          fi
          echo "value=$version" >> $GITHUB_OUTPUT

      # `cargo tauri build` without --no-default-features picks up the
      # `custom-protocol` feature (default in studio/Cargo.toml) so the
      # frontend assets are bundled into the binary instead of fetched from
      # devUrl. Matches what tool-studio.yml's PR matrix runs.
      - name: cargo tauri build (${{ matrix.target.bundle }})
        working-directory: AIO_Tool/studio
        run: cargo tauri build --bundles ${{ matrix.target.bundle }}

      # Tauri emits "HoloCubic AIO Studio_X.Y.Z_<arch>-<format>.<ext>"
      # (with a space + dynamic version). Rename to the stable per-tag scheme
      # the release body table expects.
      - name: Stage + rename bundle artifact
        shell: bash
        run: |
          mkdir -p release
          src=$(ls ${{ matrix.target.bundle_glob }} 2>/dev/null | head -1)
          if [ -z "$src" ] || [ ! -f "$src" ]; then
            echo "::error::No bundle found matching ${{ matrix.target.bundle_glob }}"
            echo "--- target/release/bundle/ contents ---"
            ls -la AIO_Tool/studio/target/release/bundle/ || true
            exit 1
          fi
          cp "$src" "release/${{ matrix.target.artifact_name }}"

      - name: Upload tool artifact
        uses: actions/upload-artifact@v4
        with:
          name: tool-${{ matrix.target.os }}
          path: release/${{ matrix.target.artifact_name }}
          if-no-files-found: error

  publish_release:
    runs-on: ubuntu-latest
    needs:
      - build_firmware
      - build_tool
    steps:
      # Need the repo for the dist/ boot+partition bin files (3 small files
      # checked in for from-scratch ESP32 flashing). See dist/README.md.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: release

      - name: Download Windows tool artifact
        uses: actions/download-artifact@v4
        with:
          name: tool-windows-latest
          path: release

      - name: Download macOS tool artifact
        uses: actions/download-artifact@v4
        with:
          name: tool-macos-latest
          path: release

      - name: Download Linux tool artifact
        uses: actions/download-artifact@v4
        with:
          name: tool-ubuntu-22.04
          path: release

      - name: Stage boot/partition bins
        run: |
          cp dist/bootloader_qio_80m.bin release/
          cp dist/partitions.bin         release/
          cp dist/boot_app0.bin          release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: HoloCubic AIO ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Files
            | File | Flash address | Notes |
            |---|---|---|
            | `HoloCubic_AIO_firmware_${{ github.ref_name }}.bin` | `0x10000` | Application firmware (internal AIO_VERSION = `${{ needs.build_firmware.outputs.version }}`) |
            | `CubicAIO_Tool-${{ github.ref_name }}-x86_64-windows-setup.exe` | — | Windows GUI flasher (Studio / Tauri 2 NSIS installer, unsigned — SmartScreen warning expected; uses the system WebView2 runtime, pre-installed on Win10 1803+ / Win11) |
            | `CubicAIO_Tool-${{ github.ref_name }}-aarch64-macos.dmg` | — | macOS Apple-Silicon DMG (unsigned — Gatekeeper will require right-click → Open on first launch; uses the system WKWebView, no runtime install) |
            | `CubicAIO_Tool-${{ github.ref_name }}-x86_64-linux.AppImage` | — | Linux x86_64 portable AppImage. Runtime needs `libwebkit2gtk-4.1` + `libudev1` — on Ubuntu 24.04+ both are present; older distros may need `sudo apt install libwebkit2gtk-4.1-0 libudev1`. `chmod +x` then double-click or run directly. |
            | `bootloader_qio_80m.bin` | `0x1000` | ESP32 second-stage bootloader |
            | `partitions.bin` | `0x8000` | Custom partition table (HoloCubic AIO layout) |
            | `boot_app0.bin` | `0xe000` | OTA boot selector |

            For first-time flash, place all four `.bin` files at the addresses above (the tool's Flasher tab can do this in one click).
            See [dist/README.md](https://github.com/asdfghj1237890/HoloCubic-AIO-Enhanced/blob/main/dist/README.md) for esptool CLI usage.

            Internal tool version: `${{ needs.build_tool.outputs.version }}` (from `AIO_Tool/Cargo.toml`).
          files: |
            release/HoloCubic_AIO_firmware_${{ github.ref_name }}.bin
            release/CubicAIO_Tool-${{ github.ref_name }}-x86_64-windows-setup.exe
            release/CubicAIO_Tool-${{ github.ref_name }}-aarch64-macos.dmg
            release/CubicAIO_Tool-${{ github.ref_name }}-x86_64-linux.AppImage
            release/bootloader_qio_80m.bin
            release/partitions.bin
            release/boot_app0.bin
