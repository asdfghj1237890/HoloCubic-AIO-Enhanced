name: tool-studio

# Studio crate lives outside the 1.82-pinned workspace (see AIO_Tool/Cargo.toml
# `exclude = ["studio"]`); it builds on stable + Tauri 2. macOS is now in the
# matrix — bundling targets nsis (Win), dmg (macOS), and deb / appimage (Linux)
# now that icons/icon.icns ships in the repo.

on:
  pull_request:
    paths:
      - 'AIO_Tool/studio/**'
      - 'AIO_Tool/crates/**'
      - 'Docs/design/studio-flasher/**'
      - '.github/workflows/tool-studio.yml'
  push:
    branches: [main]
    paths:
      - 'AIO_Tool/studio/**'
      - 'AIO_Tool/crates/**'
      - 'Docs/design/studio-flasher/**'
      - '.github/workflows/tool-studio.yml'

defaults:
  run:
    working-directory: AIO_Tool/studio

jobs:
  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle_targets: 'deb,appimage'
          - os: windows-latest
            bundle_targets: 'nsis'
          - os: macos-latest
            bundle_targets: 'dmg'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (webkit2gtk for Tauri + libudev for serialport)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: AIO_Tool/studio

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Install tauri-cli
        run: cargo install tauri-cli --version ^2.0 --locked

      - name: cargo tauri build (${{ matrix.bundle_targets }})
        run: cargo tauri build --bundles ${{ matrix.bundle_targets }}

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aio-studio-windows-x64
          path: |
            AIO_Tool/studio/target/release/aio-studio.exe
            AIO_Tool/studio/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload Linux bundles
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: aio-studio-linux-x64
          path: |
            AIO_Tool/studio/target/release/aio-studio
            AIO_Tool/studio/target/release/bundle/deb/*.deb
            AIO_Tool/studio/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload macOS bundle
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: aio-studio-macos-aarch64
          path: |
            AIO_Tool/studio/target/release/aio-studio
            AIO_Tool/studio/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
