[package]
name = "aio-studio"
version = "3.5.0"
edition = "2021"
rust-version = "1.85"
description = "HoloCubic AIO Tool — Studio (Tauri 2 + prototype HTML)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asdfghj1237890/HoloCubic-AIO-Enhanced"

[lib]
name = "aio_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aio-studio"
path = "src/main.rs"

# Tauri 2's dev/prod switch is the `custom-protocol` feature on the
# tauri crate, NOT the cargo release/debug profile. Without it,
# `generate_context!` bakes in `devUrl` (http://localhost:8765) and
# the binary refuses to start without a dev server, even when built
# with `--release`. `cargo tauri build` adds the feature behind the
# scenes; making it a default here means raw `cargo build --release`
# also produces a working binary. `cargo tauri dev` passes
# `--no-default-features` to flip back to the dev-server URL.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
# Focuses an existing aio-studio window when the user double-clicks
# the launcher again, instead of spawning a second OS process.
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.6", default-features = false, features = ["serde"] }

# Bridge into the existing Rust backend. These crates live in the main
# workspace (pinned to Rust 1.82); building them as sub-deps under
# stable picks up the same source but the newer toolchain — empirically
# fine because the existing crates already build clean on 1.82..stable.
aio-flasher   = { path = "../crates/aio-flasher" }
aio-device    = { path = "../crates/aio-device" }
aio-protocol  = { path = "../crates/aio-protocol" }
aio-converter = { path = "../crates/aio-converter" }

# Used for synchronous file-picking + cheap (header-only) image dimension probing.
rfd   = "=0.15.0"
image = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "bmp"] }

# HTTP client for the B15 Settings flow — fetches GET /api/settings + form-POSTs
# changes to existing /save<Cat>Conf handlers. Sync ureq picked over async
# reqwest to avoid pulling tokio into the Studio binary (settings I/O is
# request/response, no streaming, no concurrency).
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
# (serde_json already declared above — used by fetch_settings_http to
# pass /api/settings JSON to the JS side without typed deserialisation.)
