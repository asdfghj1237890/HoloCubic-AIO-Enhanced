[package]
name = "aio-tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HoloCubic AIO Tool — egui GUI for flashing, settings, file management, image conversion"
default-run = "aio-tool"

[[bin]]
name = "aio-tool"
path = "src/main.rs"

[dependencies]
eframe       = { workspace = true }
egui         = { workspace = true }
rfd          = { workspace = true }
serialport   = { workspace = true, features = ["libudev"] }
serde_json   = { workspace = true, features = ["preserve_order"] }

aio-protocol  = { path = "../aio-protocol" }
aio-i18n      = { path = "../aio-i18n" }
aio-device    = { path = "../aio-device" }
aio-flasher   = { path = "../aio-flasher" }
aio-converter = { path = "../aio-converter" }

[dev-dependencies]
regex = "1"
