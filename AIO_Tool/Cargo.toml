[workspace]
resolver = "2"
members = ["crates/*"]
# aio-studio (Tauri host of the prototype HTML) lives at
# `AIO_Tool/studio/` outside this workspace because Tauri's transitive
# deps require Rust 1.85+ (edition2024); this workspace stays pinned to
# 1.82 to hold the espflash / indexmap / image transitive-MSRV line (see
# the per-dep PIN notes below). The 1.82 pin was originally for egui 0.29,
# but the egui frontend has been removed — Studio is the only UI now.
# See `studio/README.md` for build instructions.
exclude = ["studio"]

[workspace.package]
version = "3.2.1"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asdfghj1237890/HoloCubic-AIO-Enhanced"

[workspace.dependencies]
bytes      = "1.7"
byteorder  = "1.5"
thiserror  = "1.0"
proptest   = "1.5"
hex        = "0.4"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
directories = "5.0"
serialport  = { version = "4.6", default-features = false }
espflash    = { version = "=3.3.0", default-features = false, features = ["serialport"] }  # PIN exactly — Plan 4 D5
# Transitive pin: espflash → esp-idf-part → indexmap. indexmap 2.8+ pulls
# hashbrown 0.17 which requires edition2024 (Rust 1.85+); our toolchain is
# pinned to 1.82. Documents intent; actual enforcement is via Cargo.lock.
# Any `cargo update -p indexmap` needs review before merge.
indexmap    = "=2.7.1"
# image 0.25.10 requires Rust 1.88 (edition2024 via moxcms transitive);
# 0.25.0..=0.25.6 have rust-version = 1.70 which fits our 1.82 pin. PIN to
# 0.25.6 exactly so `cargo update -p image` doesn't accidentally pull a
# version we can't build. Any bump past 0.25.6 needs review.
image       = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "bmp"] }
# NOTE: eframe / egui / rfd were removed together with the legacy `aio-tool`
# egui frontend. The remaining backend crates have no GUI deps; Studio
# (separate workspace) declares its own rfd/image directly.

[profile.release]
lto       = "thin"
codegen-units = 1
strip     = true
