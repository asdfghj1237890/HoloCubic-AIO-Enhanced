[workspace]
resolver = "2"
members = ["crates/*"]
# aio-studio (Tauri host of the prototype HTML) lives at
# `AIO_Tool/studio/` outside this workspace because Tauri's transitive
# deps require Rust 1.85+ (edition2024) and this workspace is pinned to
# 1.82 for egui 0.29 compatibility. See `studio/README.md` for build
# instructions.
exclude = ["studio"]

[workspace.package]
version = "3.1.3"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/asdfghj1237890/HoloCubic-AIO-Enhanced"

[workspace.dependencies]
bytes      = "1.7"
byteorder  = "1.5"
thiserror  = "1.0"
proptest   = "1.5"
hex        = "0.4"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
directories = "5.0"
serialport  = { version = "4.6", default-features = false }
espflash    = { version = "=3.3.0", default-features = false, features = ["serialport"] }  # PIN exactly — Plan 4 D5
# Transitive pin: espflash → esp-idf-part → indexmap. indexmap 2.8+ pulls
# hashbrown 0.17 which requires edition2024 (Rust 1.85+); our toolchain is
# pinned to 1.82. Documents intent; actual enforcement is via Cargo.lock.
# Any `cargo update -p indexmap` needs review before merge.
indexmap    = "=2.7.1"
# image 0.25.10 requires Rust 1.88 (edition2024 via moxcms transitive);
# 0.25.0..=0.25.6 have rust-version = 1.70 which fits our 1.82 pin. PIN to
# 0.25.6 exactly so `cargo update -p image` doesn't accidentally pull a
# version we can't build. Any bump past 0.25.6 needs review.
image       = { version = "=0.25.6", default-features = false, features = ["png", "jpeg", "bmp"] }
# eframe / egui pinned to =0.29.1 — verified rust-version = 1.76 (fits 1.82
# toolchain pin). Latest 0.34.x needs newer MSRV. `default-features = false`
# drops accesskit + persistence; we keep `default_fonts` + `glow` (default GL
# renderer) + Linux backends `wayland` + `x11`. Any bump past 0.29.x needs
# review.
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui   = { version = "=0.29.1" }
# rfd pinned to =0.15.0; rust-version unknown but transitives (ashpd 0.12.3
# at 1.75) fit 1.82. Defaults are `xdg-portal + async-std` — exactly what we
# want: xdg-portal avoids GTK on Linux, async-std provides ashpd's required
# async runtime (alternative is `tokio` which the design spec forbids).
# Earlier `default-features = false, features = ["xdg-portal"]` broke CI
# because it disabled async-std, triggering ashpd's compile_error!.
rfd    = { version = "=0.15.0" }

[profile.release]
lto       = "thin"
codegen-units = 1
strip     = true
