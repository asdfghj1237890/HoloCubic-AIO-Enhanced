[project]
name = "cubic-aio-tool"
version = "1.6.2"
description = "HoloCubic AIO firmware flashing and configuration tool"
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "pyserial>=3.5",
    "esptool>=4.1,<5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "ty>=0.0.1a1",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pyinstaller>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "esptool_v41",  # vendored upstream — we depend on PyPI esptool now
    "build",
    "dist",
    ".venv",
    "OutFile",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ANN", "N"]
# ANN401 = explicit Any allowed (used in **kwargs forwarding)
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

